
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "headerkit"
version = "0.0.1"
description = "Fast C/C++ foreign header parser and binding generator"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Axiomantic", email = "team@axiomantic.dev" },
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.3.0",
]
test = [
    "pytest>=7.0.0",
]
[tool.hatch.build.targets.wheel]
packages = ["src_py/headerkit"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py39"
