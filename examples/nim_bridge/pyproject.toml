[build-system]
requires = ["scikit-build-core>=0.9.0"]
build-backend = "scikit_build_core.build"

[project]
name = "fastmath"
version = "0.1.0"
description = "Fast math package implemented in Nim and wrapped with Headerkit"
readme = "README.md"
requires-python = ">=3.10"

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = ["fastmath"]
