name: Documentation

# The tag trigger stays: publishing versioned documentation for a release is
# release automation, in the same chain as auto-tag.yml and release.yml, and
# breaking it to save a run that happens once per release is a bad trade.
#
# The push-to-main trigger is gone -- that one fired on every merge that touched
# docs/, mkdocs.yml or headerkit/, which is most of them. Deploy the dev docs by
# hand instead; the dispatch inputs now default to exactly that:
#
#     gh workflow run Documentation --ref main
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g. 0.3), or 'dev' for the development docs"
        required: false
        default: 'dev'
      set_latest:
        description: 'Set as latest?'
        type: boolean
        default: false

concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e '.[docs]'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          MINOR="${TAG%.*}"
          echo "version=$MINOR" >> "$GITHUB_OUTPUT"
          echo "Deploying docs for version: $MINOR"

      - name: Deploy versioned docs (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mike deploy --push --update-aliases "${{ steps.version.outputs.version }}" latest

      - name: Set default version
        if: startsWith(github.ref, 'refs/tags/v')
        run: mike set-default --push latest

      - name: Deploy versioned docs (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.set_latest }}" = "true" ]; then
            mike deploy --push --update-aliases "${{ inputs.version }}" latest
          else
            mike deploy --push "${{ inputs.version }}"
          fi
