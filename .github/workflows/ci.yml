name: CI

# Manual. A four-OS matrix on every push costs money and starves the contended
# macOS runner other pull requests are waiting on, so nothing dispatches this
# but a person:
#
#     gh workflow run CI --ref <branch>
#
# The merge gate turns "nobody dispatched it" red, so a pull request cannot
# reach merge looking green on a run that never happened. See CONTRIBUTING.md.
#
# The paths-ignore lists that used to sit here are gone with the triggers they
# filtered. The documentation-only set they spelled out survives as
# .github/docs-only-paths.txt, which is now its single definition.
on:
  workflow_dispatch:
    inputs:
      full-matrix:
        description: "Run the full Python version matrix instead of the boundary versions"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install -e '.[lint]'
      - uses: pre-commit/action@v3.0.1
      - name: stubtest vendored clang bindings
        run: |
          for version in 18 19 20 21; do
            echo "::group::stubtest v${version}"
            python -m mypy.stubtest "headerkit._clang.v${version}.cindex"
            echo "::endgroup::"
          done
          echo "::group::stubtest v18 enumerations"
          python -m mypy.stubtest "headerkit._clang.v18.enumerations"
          echo "::endgroup::"

  test:
    uses: ./.github/workflows/test.yml
    with:
      full-matrix: ${{ inputs.full-matrix }}
